name: Scanner
description: >-
  Scanner is a cloud-native security data platform that indexes security logs
  directly in Amazon S3 to deliver full-text search across petabytes, continuous
  streaming threat detection, and programmatic and agent-native access to
  security data — an alternative to traditional SIEMs and data lakes. Its REST
  API (v1) covers searchable indexes, detection rules, event sinks, lookup
  tables, ad hoc queries, and query-capacity info, and it ships a hosted Model
  Context Protocol (MCP) server plus a detection-rules-as-code CLI (scanner-cli).
  Authentication is a Scanner API key presented as an HTTP Bearer token; console
  SSO is brokered by Stytch (Okta, Google Workspace, Microsoft Entra, SCIM).
  SOC 2 Type II certified and GDPR compliant. Backed by CRV.
